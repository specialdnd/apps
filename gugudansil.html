<title>구구단 실놀이 🧵</title>
<!-- v4 (2026-10-06): 1단계(핀 숫자가 답의 수 영역대로 자동 변경) / 2단계(0~9) — 상단에 두 단계가 모두 보이는 스위치, 음성 대본을 구구단 읽기(일단·이단, "육 이는 십이")로 정리 -->
<!-- v3 (2026-09-16): 구슬 묶음을 세로 줄 10칸으로, 일의 자리 숫자도 실 색으로, 힌트 켜기/끄기, 실 타래 고르기 추가 -->
<!-- v2 (2026-09-16): 제목 변경, 작게 모드 아래 배치, 상단 버튼 축소, 문제 칸 여백·간격 확대, 단별 실 색·단 표시 색 통일, 진행 점→구슬 묶음 힌트, 정답 말풍선 짧은 칭찬으로 -->
<!-- v1 (2026-09-16): 첫 제작. 1~9단 ×1~×10, 핀 누르기, 두 자리 답 연출, 재통과 굵기+반짝, 화면 모드 3종 -->
<style>
:root{
  --bg:#dfe9e1; --ink:#2b1d12; --wood:#c98b4a; --woodDark:#8a5423; --burn:#3a2414;
  --thread:#8a74b0; --ok:#2f9e6a; --no:#d64545; --gold:#f2b705; --card:#ffffff; --mute:#9aa39c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:manipulation;
  font-family:"NanumSquare Neo","NanumSquareNeo","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg)}
#stage.land{width:1280px;height:720px}
#stage.port{width:720px;height:1280px}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}

/* 상단 막대 */
#bar{position:absolute;left:0;top:0;right:0;height:80px;display:flex;align-items:center;gap:12px;padding:0 24px}
.port #bar{height:90px;justify-content:center}
.port .overlay{top:90px}
.tb{height:44px;min-width:44px;padding:0 10px;border-radius:12px;background:#fff;font-size:20px;font-weight:700;box-shadow:0 3px 0 #b9c7bc}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 #b9c7bc}
.tb.off{opacity:.45}
#modes,#levels{display:flex;background:#fff;border-radius:14px;box-shadow:0 3px 0 #b9c7bc;overflow:hidden}
#modes button,#levels button{height:44px;padding:0 14px;font-size:18px;font-weight:700;background:transparent}
#modes button.on{background:var(--thread);color:#fff}
#levels button.on{background:var(--tc);color:#fff}
.sp{flex:1}
#bar button,#title{white-space:nowrap}
.port #bar{gap:7px;padding:0 12px}
.port #title{display:none}
.port #modes button,.port #levels button{padding:0 9px;font-size:16px}
#title{font-size:22px;font-weight:800}

/* 원판 */
#board{position:absolute}
.land #board{left:30px;top:88px;width:620px;height:620px}
.port #board{left:30px;top:100px;width:660px;height:660px}
#wrap{position:relative;width:100%;height:100%}
#disc{width:100%;height:100%;display:block;overflow:visible}
#fx{position:absolute;inset:0;pointer-events:none}
.hit{cursor:pointer}
.bead{transform-box:fill-box;transform-origin:center}
.label{font-size:50px;transition:font-size .2s;font-weight:900;fill:var(--burn);text-anchor:middle;dominant-baseline:central}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* 오른쪽(아래쪽) 판 */
#stage{--tc:#8a74b0}
#panel{position:absolute;display:flex;flex-direction:column}
.land #panel{left:680px;top:96px;width:570px;height:606px;gap:26px}
.port #panel{left:30px;top:780px;width:660px;height:480px;gap:22px}
#top{display:flex;flex-direction:column;align-items:center;gap:30px}
.port #top{flex-direction:row;gap:20px}
#dan{font-size:76px;font-weight:900;line-height:1;padding:12px 40px 16px;border-radius:24px;background:var(--tc);color:#fff;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);white-space:nowrap;transition:background .3s}
.port #dan{font-size:56px;padding:12px 24px 16px}
#prob{width:100%;background:var(--card);border-radius:28px;padding:16px 44px;text-align:center;font-size:86px;font-weight:900;line-height:1.1;
  box-shadow:0 5px 0 #b9c7bc;white-space:nowrap}
.port #prob{flex:1;font-size:70px;padding:14px 30px}
#ans{display:inline-block;min-width:1.3em;color:var(--tc)}
#ans .t{color:var(--mute)}
#ans .o{color:var(--tc)}
#lower{flex:1;display:flex;justify-content:space-between;align-items:stretch;min-height:0}
#hint{display:flex;align-items:flex-start;gap:3px;padding-left:4px}
.port #hint{gap:10px;padding-left:20px}
#hint.off{visibility:hidden}
.col{display:flex;flex-direction:column;align-items:center;gap:5px}
.cn{font-size:16px;font-weight:800;color:#8d978f;height:20px;line-height:20px}
.cn.now{color:var(--tc);font-size:19px}
.stack{position:relative;display:flex;flex-direction:column;gap:3px;padding:6px 5px;border-radius:16px;background:rgba(255,255,255,.8);border:2px solid var(--tc)}
.stack:before{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:3px;margin-left:-1.5px;background:var(--tc)}
.stack.empty{background:transparent;border:2px dashed #c3cec6}
.stack.empty:before{display:none}
.bd{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6ddb8,#d7a86e 55%,#a8733d)}
.bd.ghost{visibility:hidden}
#buddy{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;width:170px;flex-shrink:0}
#buddyFace{width:110px;height:110px}
.port #buddyFace{width:120px;height:120px}
#bubble{position:relative;background:#fff;border-radius:20px;padding:10px 16px;font-size:24px;font-weight:800;text-align:center;max-width:170px;word-break:keep-all;box-shadow:0 4px 0 #b9c7bc}
#bubble:before{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top:14px solid #fff;border-bottom:0}
#bubble.no{color:var(--no)} #bubble.ok{color:var(--tc)}

/* 숫자 연출 */
.num{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:78px;background:#fff;border-radius:22px;padding:2px 18px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap;display:flex}
.num .t{color:var(--mute)} .num .o{color:var(--tc)}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:900;color:var(--mute);font-size:60px}
.spark{position:absolute;transform:translate(-50%,-50%);font-size:34px}

/* 겹 화면 */
.overlay{position:absolute;left:0;right:0;bottom:0;top:80px;display:flex;align-items:center;justify-content:center;background:rgba(223,233,225,.96);z-index:10}
.hidden{display:none!important}
#home .box{text-align:center}
#home h1{font-size:72px;margin:0 0 6px}
#home p{font-size:30px;margin:0 0 26px;font-weight:700}
#danGrid{display:grid;grid-template-columns:repeat(3,190px);gap:18px;justify-content:center}
.port #danGrid{grid-template-columns:repeat(3,200px)}
.danBtn{height:150px;border-radius:26px;background:#fff;box-shadow:0 6px 0 #b9c7bc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.danBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9c7bc}
.danBtn b{font-size:52px}
.danBtn .stk{width:64px;height:64px}
.danBtn .empty{width:64px;height:64px;border-radius:50%;border:4px dashed #cfd8d1}
.land #danGrid{grid-template-columns:repeat(5,190px)}
.land .danBtn{height:170px}
#credit{margin-top:28px;font-size:18px;color:#5d6b61;line-height:1.6}
#done .card{background:#fff;border-radius:36px;padding:36px 50px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#done h2{font-size:70px;margin:0}
#done .stkBig{width:240px;height:240px;margin:14px auto}
#done p{font-size:36px;font-weight:800;margin:0 0 24px}
.big{height:78px;padding:0 30px;border-radius:20px;font-size:32px;font-weight:800;background:#eef3ef;box-shadow:0 5px 0 #b9c7bc;margin:0 6px}
.big.main{background:var(--ok);color:#fff;box-shadow:0 5px 0 #1f6e4a}
#spools .box{text-align:center}
#spools h2{font-size:56px;margin:0 0 30px}
#spoolRow{display:flex;gap:26px;justify-content:center}
.spool{width:170px;height:220px;border-radius:26px;background:#fff;box-shadow:0 6px 0 #b9c7bc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.spool:active{transform:translateY(4px);box-shadow:0 2px 0 #b9c7bc}
.spool svg{width:110px;height:150px}
.spool .tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#2b1d12;color:#fff;font-size:18px;font-weight:800;padding:4px 12px;border-radius:10px;white-space:nowrap}
.port #spoolRow{flex-wrap:wrap;max-width:420px;margin:0 auto}
.tb.on{background:#fff3c4}
#toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:#2b1d12;color:#fff;padding:14px 24px;border-radius:14px;font-size:22px;z-index:20;max-width:90%}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div id="stage" class="land">
  <div id="bar">
    <button class="tb" id="bHome" aria-label="처음으로">🏠</button>
    <div id="title">구구단 실놀이</div>
    <div class="sp"></div>
    <div id="levels" aria-label="단계"><button data-l="1">1단계</button><button data-l="2">2단계</button></div>
    <button class="tb on" id="bHint" aria-label="힌트">💡 힌트</button>
    <button class="tb" id="bThread" aria-label="실 바꾸기">🧵</button>
    <button class="tb" id="bSound" aria-label="효과음">🔊</button>
    <button class="tb" id="bVoice" aria-label="읽어 주기">🗣️</button>
    <div id="modes">
      <button data-m="full">전체</button><button data-m="normal" class="on">일반</button><button data-m="small">작게</button>
    </div>
  </div>

  <div id="board"><div id="wrap"><svg id="disc" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"></svg><div id="fx"></div></div></div>

  <div id="panel">
    <div id="top">
      <div id="dan">2단</div>
      <div id="prob"><span id="pa">2</span> × <span id="pb">1</span> = <span id="ans">?</span></div>
    </div>
    <div id="lower">
      <div id="hint"></div>
      <div id="buddy"><div id="bubble">핀을 눌러요</div><svg id="buddyFace" viewBox="0 0 140 140"></svg></div>
    </div>
  </div>

  <div id="home" class="overlay">
    <div class="box">
      <h1>🧵 구구단 실놀이</h1>
      <p>몇 단을 할까요?</p>
      <div id="danGrid"></div>
      <div id="credit">구구단 실놀이 v4<br>제작 : specialdnd@gmail.com</div>
    </div>
  </div>

  <div id="done" class="overlay hidden">
    <div class="card">
      <h2 id="doneTitle">2단 완성!</h2>
      <svg class="stkBig" id="doneStk" viewBox="0 0 200 200"></svg>
      <p id="doneText">오각형 모양이 되었어요</p>
      <button class="big" id="dAgain">🔁 다시</button>
      <button class="big main" id="dNext">다음 단 ▶</button>
      <button class="big" id="dHome">🏠 처음</button>
    </div>
  </div>
  <div id="spools" class="overlay hidden">
    <div class="box">
      <h2 id="spoolTitle">어떤 실로 할까요?</h2>
      <div id="spoolRow"></div>
    </div>
  </div>
  <div id="toast" class="hidden"></div>
</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var $=function(id){return document.getElementById(id)};
var stage=$("stage"), disc=$("disc"), fx=$("fx"), wrap=$("wrap");
var C=400, R=300;
var P=[];
for(var i=0;i<10;i++){
  var a=(-90+36*i)*Math.PI/180;
  P.push({x:C+R*Math.cos(a),y:C+R*Math.sin(a),lx:C+355*Math.cos(a),ly:C+355*Math.sin(a)});
}
var NAME={1:"십각형",9:"십각형",2:"오각형",8:"오각형",3:"뾰족 별",7:"뾰족 별",4:"별",6:"별",5:"한 줄"};
var JOSA=["","은","는","은","는","는","은","은","은","는","은"];
var SINO=["영","일","이","삼","사","오","육","칠","팔","구","십"];
function danWord(x){return SINO[x]+"단";}            // 6단 → "육단"
function probWord(a,b){                              // 6×2 → "육 이는?"  /  6×10 → "육 곱하기 십은?"
  return b===10 ? SINO[a]+" 곱하기 십은?" : SINO[a]+" "+SINO[b]+JOSA[b]+"?";
}
function sinoNum(v){                                 // 12 → "십이", 60 → "육십"
  if(v<10)return SINO[v];
  var t=Math.floor(v/10), o=v%10;
  return (t===1?"십":SINO[t]+"십")+(o?SINO[o]:"");
}
function ansWord(a,b,v){                             // 6×2=12 → "육 이는 십이"
  return probWord(a,b).replace("?","")+" "+sinoNum(v);
}
var STORE="gugudan-pin-done";
var PRAISE=["잘했어요!","좋아요!","최고예요!","멋져요!"];
var COLORS=["#8a74b0","#d93a3a","#2f6fd6","#8a5cc7","#2e9e5b","#e0508f","#0e9fbf","#ef7d0f","#4a4fb5","#b0306a"];
var curColor=null;
var COLOR_NAME={"#d93a3a":"빨강","#2f6fd6":"파랑","#8a5cc7":"보라","#2e9e5b":"초록","#e0508f":"분홍","#0e9fbf":"하늘","#ef7d0f":"주황","#4a4fb5":"남색","#b0306a":"자주"};
function tc(){return curColor||COLORS[n]||COLORS[0];}

function el(tag,attrs,parent){
  var e=document.createElementNS(NS,tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

/* ---------- 원판 그리기 ---------- */
var layerLines, layerGlow, layerPins, ringNow, ringHint, ringBad, beads=[];
function buildDisc(){
  disc.innerHTML="";
  var defs=el("defs",{},disc);
  var g1=el("radialGradient",{id:"wood",cx:"45%",cy:"40%",r:"70%"},defs);
  el("stop",{offset:"0%","stop-color":"#dca267"},g1);
  el("stop",{offset:"70%","stop-color":"#c98b4a"},g1);
  el("stop",{offset:"100%","stop-color":"#b0743a"},g1);
  var g2=el("radialGradient",{id:"bead",cx:"35%",cy:"30%",r:"70%"},defs);
  el("stop",{offset:"0%","stop-color":"#f6ddb8"},g2);
  el("stop",{offset:"55%","stop-color":"#d7a86e"},g2);
  el("stop",{offset:"100%","stop-color":"#a8733d"},g2);
  var cp=el("clipPath",{id:"clip"},defs);
  el("circle",{cx:C,cy:C,r:388},cp);

  el("circle",{cx:C,cy:C+8,r:390,fill:"rgba(0,0,0,.12)"},disc);
  el("circle",{cx:C,cy:C,r:390,fill:"url(#wood)"},disc);
  // 나뭇결
  var grain=el("g",{"clip-path":"url(#clip)",fill:"none",stroke:"#8a5423"},disc);
  var seed=7; function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  for(var j=0;j<38;j++){
    var y=6+j*21+rnd()*8, w1=(rnd()-.5)*30, w2=(rnd()-.5)*30;
    el("path",{d:"M-10 "+y+" C 200 "+(y+w1)+", 420 "+(y-w2)+", 810 "+(y+w1*.6),
      "stroke-width":(1+rnd()*2.4).toFixed(1),opacity:(.08+rnd()*.2).toFixed(2)},grain);
  }
  el("circle",{cx:C,cy:C,r:388,fill:"none",stroke:"#9a6230","stroke-width":4,opacity:.6},disc);

  // 숫자
  for(var i=0;i<10;i++){
    var t=el("text",{x:P[i].lx,y:P[i].ly,"class":"label",id:"lab"+i},disc);
    t.textContent=i;
  }
  layerLines=el("g",{},disc);
  layerGlow=el("g",{},disc);
  layerPins=el("g",{},disc);
  ringHint=el("circle",{r:40,fill:"none",stroke:"#f2b705","stroke-width":9,"class":"pulse",visibility:"hidden"},layerPins);
  ringNow=el("circle",{r:33,fill:"none",stroke:tc(),"stroke-width":6,opacity:.9},layerPins);
  ringBad=el("circle",{r:36,fill:"rgba(214,69,69,.25)",stroke:"#d64545","stroke-width":6,visibility:"hidden"},layerPins);
  beads=[];
  for(var i=0;i<10;i++){
    var g=el("g",{"class":"bead"},layerPins);
    el("ellipse",{cx:P[i].x+3,cy:P[i].y+8,rx:24,ry:18,fill:"rgba(0,0,0,.22)"},g);
    el("circle",{cx:P[i].x,cy:P[i].y,r:24,fill:"url(#bead)",stroke:"#9b6936","stroke-width":1.5},g);
    beads.push(g);
  }
  // 0번 핀 매듭
  var knot=el("g",{stroke:"#fff","stroke-width":2.5,fill:"none","stroke-linecap":"round"},layerPins);
  el("path",{d:"M"+(P[0].x+18)+" "+(P[0].y-8)+" q14 -18 8 -34",stroke:tc()},knot);
  el("path",{d:"M"+(P[0].x+20)+" "+(P[0].y-4)+" q22 -8 26 -26",stroke:"#b7a6d6"},knot);
  // 누르는 자리(크게)
  for(var i=0;i<10;i++){
    var h=el("circle",{cx:P[i].x,cy:P[i].y,r:52,fill:"transparent","class":"hit","data-p":i},disc);
    h.addEventListener("pointerdown",function(e){e.preventDefault();onPin(+this.getAttribute("data-p"));});
  }
}
function place(ring,p){ring.setAttribute("cx",P[p].x);ring.setAttribute("cy",P[p].y);}

/* ---------- 실(선) ---------- */
var edges={};
function edgeW(c){return Math.min(8+5*(c-1),24);}
function styleEdge(e){
  var w=edgeW(e.count);
  e.base.setAttribute("stroke-width",w);
  e.twist.setAttribute("stroke-width",(w*.5).toFixed(1));
  e.twist.setAttribute("stroke-dasharray",(w*1.1).toFixed(1)+" "+(w*1.1).toFixed(1));
}
function makeLine(a,b,parent,color,width){
  var ln=el("line",{x1:P[a].x,y1:P[a].y,x2:P[a].x,y2:P[a].y,stroke:color,"stroke-width":width,"stroke-linecap":"round"},parent);
  return ln;
}
function animLine(lines,a,b,ms,cb){
  var t0=null;
  function step(ts){
    if(t0===null)t0=ts;
    var t=Math.min(1,(ts-t0)/ms), e=1-Math.pow(1-t,2);
    var x=P[a].x+(P[b].x-P[a].x)*e, y=P[a].y+(P[b].y-P[a].y)*e;
    lines.forEach(function(l){l.setAttribute("x2",x);l.setAttribute("y2",y);});
    if(t<1)requestAnimationFrame(step);else if(cb)cb();
  }
  requestAnimationFrame(step);
}
function connect(a,b,cb){
  var key=Math.min(a,b)+"-"+Math.max(a,b);
  var e=edges[key];
  if(!e){
    var g=el("g",{},layerLines);
    var base=makeLine(a,b,g,tc(),8), twist=makeLine(a,b,g,"#ffffff",4);
    e=edges[key]={count:1,base:base,twist:twist,a:a,b:b};
    styleEdge(e);
    animLine([base,twist],a,b,450,cb);
    return false;
  }
  // 다시 지나가는 선: 금빛 실이 한 번 지나가고 → 굵어짐 + 반짝
  var tmp=makeLine(a,b,layerGlow,"#f2b705",edgeW(e.count)+4);
  animLine([tmp],a,b,450,function(){
    tmp.remove();
    e.count++; styleEdge(e);
    glow(e,edgeW(e.count)+18);
    travelSpark(a,b);
    sfx("repeat");
    if(cb)cb();
  });
  return true;
}
function glow(e,w){
  var x1=e.base.getAttribute("x1"),y1=e.base.getAttribute("y1"),x2=e.base.getAttribute("x2"),y2=e.base.getAttribute("y2");
  var g=el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:"#ffe27a","stroke-width":w,"stroke-linecap":"round",opacity:0},layerGlow);
  var an=g.animate([{opacity:0},{opacity:.85},{opacity:0}],{duration:900,easing:"ease-out"});
  an.onfinish=function(){g.remove();};
}
function pct(x){return (x/8)+"%";}
function spark(x,y,ch,dx,dy,ms){
  var s=document.createElement("div");
  s.className="spark"; s.textContent=ch||"✨";
  s.style.left=pct(x); s.style.top=pct(y);
  fx.appendChild(s);
  var an=s.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},
    {transform:"translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(1.1)",opacity:0}],{duration:ms||700,easing:"ease-out"});
  an.onfinish=function(){s.remove();};
}
function burst(p,n,ch){
  for(var i=0;i<n;i++){var a=Math.PI*2*i/n;spark(P[p].x,P[p].y,ch,Math.cos(a)*70,Math.sin(a)*70,650);}
}
function travelSpark(a,b){
  var s=document.createElement("div");
  s.className="spark"; s.textContent="🌟"; s.style.fontSize="44px";
  fx.appendChild(s);
  var an=s.animate([{left:pct(P[a].x),top:pct(P[a].y)},{left:pct(P[b].x),top:pct(P[b].y)}],{duration:550,easing:"ease-in-out"});
  an.onfinish=function(){s.remove();burst(b,6);};
}
function popBead(p){
  beads[p].animate([{transform:"scale(1)"},{transform:"scale(1.35)"},{transform:"scale(1)"}],{duration:350});
  var lab=$("lab"+p);
  lab.animate([{fill:"#3a2414"},{fill:tc()},{fill:"#3a2414"}],{duration:900});
}

/* ---------- 소리 ---------- */
var AC=null, soundOn=true, voiceOn=true;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(f,at,dur,type,vol,f2){
  var c=ac(); if(!c)return;
  var t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.25,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
function sfx(k){
  if(!soundOn)return;
  if(k==="ok"){tone(784,0,.2,"triangle",.3);tone(1047,.09,.25,"triangle",.3);tone(1319,.18,.45,"triangle",.3);}
  else if(k==="no"){tone(700,0,1.1,"sine",.32,560);tone(1400,0,.5,"sine",.07,1120);}
  else if(k==="repeat"){[1568,1976,2349,2637].forEach(function(f,i){tone(f,i*.06,.25,"sine",.12);});}
  else if(k==="done"){[523,659,784,1047].forEach(function(f,i){tone(f,i*.14,.3,"triangle",.3);});
    tone(523,.6,1.2,"triangle",.18);tone(659,.6,1.2,"triangle",.18);tone(784,.6,1.2,"triangle",.18);tone(1047,.6,1.2,"triangle",.2);}
}
function say(text){
  if(!voiceOn||!soundOn||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=.9;speechSynthesis.speak(u);}catch(e){}
}

/* ---------- 캐릭터(구슬이) ---------- */
function buddy(state,text,cls){
  var s=$("buddyFace"), h='<defs><radialGradient id="bb" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#f6ddb8"/><stop offset="60%" stop-color="#d7a86e"/><stop offset="100%" stop-color="#a8733d"/></radialGradient></defs>'+
    '<circle cx="70" cy="74" r="56" fill="url(#bb)" stroke="#9b6936" stroke-width="2"/>'+
    '<path d="M70 18 q-6 -12 4 -16" stroke="'+tc()+'" stroke-width="5" fill="none" stroke-linecap="round"/>'+
    '<circle cx="42" cy="88" r="8" fill="#f4a3a3" opacity=".6"/><circle cx="98" cy="88" r="8" fill="#f4a3a3" opacity=".6"/>';
  if(state==="happy"){
    h+='<path d="M44 70 q8 -10 16 0 M80 70 q8 -10 16 0" stroke="#3a2414" stroke-width="5" fill="none" stroke-linecap="round"/>'+
       '<path d="M52 88 q18 22 36 0 z" fill="#3a2414"/><path d="M60 96 q10 8 20 0" fill="#e86a6a"/>'+
       '<text x="118" y="30" font-size="26">✨</text>';
  }else if(state==="cheer"){
    h+='<circle cx="52" cy="70" r="7" fill="#3a2414"/><circle cx="88" cy="70" r="7" fill="#3a2414"/>'+
       '<circle cx="54" cy="68" r="2.5" fill="#fff"/><circle cx="90" cy="68" r="2.5" fill="#fff"/>'+
       '<path d="M58 96 q12 -6 24 0" stroke="#3a2414" stroke-width="5" fill="none" stroke-linecap="round"/>'+
       '<text x="112" y="34" font-size="26">💪</text>';
  }else{
    h+='<circle cx="52" cy="70" r="7" fill="#3a2414"/><circle cx="88" cy="70" r="7" fill="#3a2414"/>'+
       '<circle cx="54" cy="68" r="2.5" fill="#fff"/><circle cx="90" cy="68" r="2.5" fill="#fff"/>'+
       '<path d="M56 90 q14 12 28 0" stroke="#3a2414" stroke-width="5" fill="none" stroke-linecap="round"/>';
  }
  s.innerHTML=h;
  var b=$("bubble"); b.textContent=text; b.className=cls||"";
  if(state!=="normal")s.animate([{transform:"translateY(0)"},{transform:"translateY(-14px)"},{transform:"translateY(0)"}],{duration:400});
}

/* ---------- 완성 스티커 ---------- */
function sticker(svg,n,col){
  col=col||COLORS[n];
  svg.innerHTML="";
  el("circle",{cx:100,cy:100,r:96,fill:"#d8a064",stroke:"#9a6230","stroke-width":4},svg);
  var pts=[];
  for(var k=0;k<=10;k++){var d=(n*k)%10,a=(-90+36*d)*Math.PI/180;pts.push((100+72*Math.cos(a)).toFixed(1)+","+(100+72*Math.sin(a)).toFixed(1));}
  el("polyline",{points:pts.join(" "),fill:"none",stroke:col,"stroke-width":7,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
  el("polyline",{points:pts.join(" "),fill:"none",stroke:"#fff","stroke-width":3,"stroke-dasharray":"6 6"},svg);
  for(var i=0;i<10;i++){var a=(-90+36*i)*Math.PI/180;el("circle",{cx:100+72*Math.cos(a),cy:100+72*Math.sin(a),r:7,fill:"#f1d1a6",stroke:"#9b6936"},svg);}
}
function loadDone(){try{return JSON.parse(localStorage.getItem(STORE)||"{}")||{};}catch(e){return {};}}
function saveDone(n){try{var d=loadDone();d[n]=tc();localStorage.setItem(STORE,JSON.stringify(d));}catch(e){}}

/* ---------- 흐름 ---------- */
var n=2,k=1,pos=0,wrong=0,busy=false;
function buildHome(){
  var grid=$("danGrid"), d=loadDone(); grid.innerHTML="";
  for(var i=1;i<=9;i++){
    var b=document.createElement("button"); b.className="danBtn";
    b.innerHTML="<b style=\"color:"+COLORS[i]+"\">"+i+"단</b>";
    if(d[i]){var s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 200 200");s.setAttribute("class","stk");sticker(s,i,typeof d[i]==="string"?d[i]:null);b.appendChild(s);}
    else{var e=document.createElement("div");e.className="empty";b.appendChild(e);}
    (function(x){b.addEventListener("click",function(){ac();showSpools(x);});})(i);
    grid.appendChild(b);
  }
}
function showHome(){
  busy=true; buildHome();
  $("home").classList.remove("hidden"); $("done").classList.add("hidden");
  if(window.speechSynthesis)speechSynthesis.cancel();
}
function startDan(x,col){
  if(col)curColor=col; else if(x!==n)curColor=null;
  n=x; k=1; pos=0; wrong=0; busy=false; edges={};
  stage.style.setProperty("--tc",tc());
  buildDisc(); place(ringNow,0);
  $("dan").textContent=n+"단";
  $("home").classList.add("hidden"); $("done").classList.add("hidden"); $("spools").classList.add("hidden");
  fx.innerHTML="";
  buddy("normal","0에서 출발해요");
  renderProb(); speakProb();
}
function renderProb(){
  $("pa").textContent=n; $("pb").textContent=k;
  var a=$("ans"); a.textContent="?"; a.style.color="";
  var hint=$("hint"); hint.innerHTML="";
  for(var c=1;c<=10;c++){
    var col=document.createElement("div"); col.className="col";
    var cn=document.createElement("div"); cn.className="cn"+(c===k?" now":""); cn.textContent=c; col.appendChild(cn);
    var st=document.createElement("div"); st.className="stack"+(c>k?" empty":"");
    for(var j=0;j<n;j++){var bd=document.createElement("div");bd.className="bd"+(c>k?" ghost":"");st.appendChild(bd);}
    col.appendChild(st); hint.appendChild(col);
    if(c===k)st.animate([{transform:"translateY(-40px)",opacity:0},{transform:"translateY(0)",opacity:1}],{duration:380,easing:"ease-out"});
  }
  setLabels(n*k);
  ringHint.setAttribute("visibility","hidden");
  $("prob").animate([{transform:"scale(.92)",opacity:.4},{transform:"scale(1)",opacity:1}],{duration:260});
}
function speakProb(){say(probWord(n,k));}

function onPin(p){
  if(busy)return;
  ac();
  var ans=n*k, target=ans%10;
  if(p===target)correct(p,ans);else miss(p,ans,target);
}
function correct(p,ans){
  busy=true; wrong=0;
  ringHint.setAttribute("visibility","hidden");
  sfx("ok"); popBead(p);
  var two=ans>=10;
  $("ans").innerHTML=(two&&level===2)?'<span class="t">'+Math.floor(ans/10)+'</span><span class="o">'+(ans%10)+'</span>':'<span class="o">'+ans+'</span>';
  say(ansWord(n,k,ans));
  buddy("happy",PRAISE[k%PRAISE.length],"ok");
  numberFx(p,ans);
  var from=pos; pos=p;
  var last=(k===10);
  var linesDone=false, timeDone=false;
  function go(){
    if(!(linesDone&&timeDone))return;
    place(ringNow,pos);
    if(last){finish();return;}
    k++; renderProb(); busy=false;
    buddy("normal","핀을 눌러요"); speakProb();
  }
  var re=connect(from,p,function(){linesDone=true;burst(p,5);go();});
  setTimeout(function(){timeDone=true;go();},(two&&level===2)?2300:1600);
}
function numberFx(p,ans){
  // 핀 안쪽(원 중심 쪽)에 숫자 말풍선
  var bx=C+(P[p].x-C)*.66, by=C+(P[p].y-C)*.66;
  var box=document.createElement("div"); box.className="num";
  box.style.left=pct(bx); box.style.top=pct(by);
  var tens=Math.floor(ans/10), ones=ans%10;
  var tS=null, oS=document.createElement("span"); oS.className="o"; oS.textContent=(level===1?ans:ones);
  if(ans>=10&&level===2){tS=document.createElement("span");tS.className="t";tS.textContent=tens;box.appendChild(tS);}
  box.appendChild(oS); fx.appendChild(box);
  box.animate([{transform:"translate(-50%,-50%) scale(.2)"},{transform:"translate(-50%,-50%) scale(1.15)"},{transform:"translate(-50%,-50%) scale(1)"}],{duration:380});
  var dx=(P[p].x-bx)/800*wrap.clientWidth, dy=(P[p].y-by)/800*wrap.clientHeight;
  function flyIn(delay){
    var an=box.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:"translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(.35)",opacity:.2}],
      {duration:550,delay:delay,easing:"ease-in",fill:"forwards"});
    an.onfinish=function(){box.remove();popBead(p);};
  }
  if(ans<10||level===1){flyIn(ans<10?650:900);return;}
  // 두 자리: 24 → "20"이 떠올라 사라지고 → 4만 핀으로
  setTimeout(function(){
    var r=tS.getBoundingClientRect(), wr=wrap.getBoundingClientRect(), sc=wr.width/wrap.clientWidth||1;
    var f=document.createElement("div"); f.className="float"; f.textContent=tens+"0";
    f.style.left=((r.left+r.width/2-wr.left)/sc)+"px"; f.style.top=((r.top+r.height/2-wr.top)/sc)+"px";
    fx.appendChild(f);
    tS.style.visibility="hidden";
    var an=f.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:"translate(-50%,-150%) scale(1.2)",opacity:1,offset:.35},
      {transform:"translate(-50%,-260%) scale(.8)",opacity:0}],{duration:900,easing:"ease-out"});
    an.onfinish=function(){f.remove();};
    tS.animate([{maxWidth:"60px"},{maxWidth:"0px"}],{duration:400,fill:"forwards"});
  },800);
  flyIn(1600);
}
function miss(p,ans,target){
  busy=true; wrong++;
  sfx("no");
  place(ringBad,p); ringBad.setAttribute("visibility","visible");
  wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake");
  $("prob").animate([{transform:"translateX(0)"},{transform:"translateX(-10px)"},{transform:"translateX(10px)"},{transform:"translateX(0)"}],{duration:300});
  var tens=Math.floor(ans/10);
  var msg;
  if(wrong>=2){
    place(ringHint,target); ringHint.setAttribute("visibility","visible");
    msg=level===1?"반짝이는 수를 눌러요":"반짝이는 핀을 눌러요";
  }else if(level===2&&ans>=10&&p===tens&&tens!==target){
    msg="뒤 숫자를 눌러요";
  }else msg="다시 해 봐요";
  buddy("cheer",msg,"no");
  setTimeout(function(){ringBad.setAttribute("visibility","hidden");wrap.classList.remove("shake");busy=false;},600);
}
function finish(){
  busy=true;
  Object.keys(edges).forEach(function(key,i){var e=edges[key];setTimeout(function(){glow(e,edgeW(e.count)+22);},i*90);});
  for(var i=0;i<10;i++)(function(i){setTimeout(function(){burst(i,4,"⭐");},200+i*70);})(i);
  sfx("done"); saveDone(n);
  buddy("happy",n+"단 완성!","ok");
  setTimeout(function(){
    say(danWord(n)+" 완성! "+NAME[n]+" 모양이 되었어요");
    $("doneTitle").textContent=n+"단 완성! ⭐";
    $("doneText").textContent=NAME[n]+" 모양이 되었어요";
    sticker($("doneStk"),n,tc());
    $("dNext").textContent=(n<9?(n+1)+"단 ▶":"1단 ▶");
    var d=$("done"); d.classList.remove("hidden");
    $("doneStk").animate([{transform:"scale(.2) rotate(-90deg)"},{transform:"scale(1.1) rotate(10deg)"},{transform:"scale(1) rotate(0)"}],{duration:700});
  },1800);
}

/* ---------- 실 타래 고르기 ---------- */
function spoolSVG(col){
  var h='<svg viewBox="0 0 110 150">'+
    '<rect x="14" y="8" width="82" height="16" rx="8" fill="#d7a86e" stroke="#9b6936" stroke-width="2"/>'+
    '<rect x="14" y="126" width="82" height="16" rx="8" fill="#d7a86e" stroke="#9b6936" stroke-width="2"/>'+
    '<rect x="24" y="24" width="62" height="102" fill="'+col+'"/>';
  for(var y=30;y<124;y+=8)h+='<path d="M24 '+y+' L86 '+(y+4)+'" stroke="#fff" stroke-opacity=".45" stroke-width="2.5"/>';
  h+='<path d="M86 60 q20 10 14 40 q-4 20 6 34" stroke="'+col+'" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
  return h;
}
var spoolMid=false;
function spoolChoices(x){
  var base=COLORS[x], out=[base];
  ["#d93a3a","#2f6fd6","#2e9e5b","#e0508f","#ef7d0f"].forEach(function(c){if(out.length<4&&c!==base)out.push(c);});
  if(curColor&&out.indexOf(curColor)<0)out[3]=curColor;
  return out;
}
function showSpools(x,mid){
  spoolMid=!!mid; busy=true;
  $("home").classList.add("hidden"); $("done").classList.add("hidden");
  $("spoolTitle").textContent=mid?"실을 바꿀까요?":x+"단, 어떤 실로 할까요?";
  var row=$("spoolRow"); row.innerHTML="";
  spoolChoices(x).forEach(function(c,i){
    var b=document.createElement("button"); b.className="spool";
    b.innerHTML=spoolSVG(c)+'<b style="font-size:28px;color:'+c+'">'+(COLOR_NAME[c]||"")+'</b>'+(i===0?'<span class="tag">'+x+'단 색</span>':'');
    b.onclick=function(){ac();pickColor(x,c);};
    row.appendChild(b);
  });
  $("spools").classList.remove("hidden");
  say(mid?"실을 골라요":danWord(x)+", 실을 골라요");
}
function pickColor(x,c){
  $("spools").classList.add("hidden");
  if(!spoolMid){startDan(x,c);return;}
  curColor=c; stage.style.setProperty("--tc",c);
  Object.keys(edges).forEach(function(k){edges[k].base.setAttribute("stroke",c);});
  ringNow.setAttribute("stroke",c);
  var kp=disc.querySelector("g[stroke='#fff'] path"); if(kp)kp.setAttribute("stroke",c);
  buddy("normal","핀을 눌러요");
  busy=false;
}

/* ---------- 버튼 ---------- */
var level=2;
try{if(localStorage.getItem("gugudan-pin-level")==="1")level=1;}catch(e){}
function setLabels(ans){
  var tens=(level===1&&ans>=10)?Math.floor(ans/10):0;
  for(var i=0;i<10;i++){
    var t=$("lab"+i); if(!t)continue;
    var txt=String(tens*10+i);
    if(t.textContent!==txt){
      t.textContent=txt;
      t.animate([{opacity:.15},{opacity:1}],{duration:280});
    }
    t.setAttribute("font-size",txt.length>1?36:50);
  }
}
function applyLevel(){
  Array.prototype.forEach.call(document.querySelectorAll("#levels button"),function(b){
    b.classList.toggle("on",b.getAttribute("data-l")===String(level));
  });
  setLabels(n*k);
}
Array.prototype.forEach.call(document.querySelectorAll("#levels button"),function(b){
  b.onclick=function(){
    var v=+b.getAttribute("data-l");
    if(busy||v===level)return;
    level=v; applyLevel();
    try{localStorage.setItem("gugudan-pin-level",String(level));}catch(e){}
    toast(level===1?"1단계: 핀에 답이 있는 수가 보여요":"2단계: 핀에 0~9만 보여요");
  };
});
var hintOn=true;
try{if(localStorage.getItem("gugudan-pin-hint")==="off")hintOn=false;}catch(e){}
function applyHint(){$("hint").classList.toggle("off",!hintOn);$("bHint").classList.toggle("on",hintOn);$("bHint").textContent=hintOn?"💡 힌트":"💡 끔";}
$("bHint").onclick=function(){hintOn=!hintOn;applyHint();try{localStorage.setItem("gugudan-pin-hint",hintOn?"on":"off");}catch(e){}};
applyHint(); applyLevel();
$("bThread").onclick=function(){if(busy||!$("home").classList.contains("hidden"))return;showSpools(n,true);};
$("bHome").onclick=showHome;
$("dHome").onclick=showHome;
$("dAgain").onclick=function(){startDan(n,tc());};
$("dNext").onclick=function(){showSpools(n<9?n+1:1);};
$("bSound").onclick=function(){soundOn=!soundOn;this.textContent=soundOn?"🔊":"🔇";this.classList.toggle("off",!soundOn);if(!soundOn&&window.speechSynthesis)speechSynthesis.cancel();};
$("bVoice").onclick=function(){voiceOn=!voiceOn;this.classList.toggle("off",!voiceOn);if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel();toast(voiceOn?"문제 읽어 주기 켬":"문제 읽어 주기 끔");};
$("dan").onclick=function(){if(!busy)speakProb();};
$("prob").onclick=function(){if(!busy)speakProb();};
document.addEventListener("keydown",function(e){if(/^[0-9]$/.test(e.key)&&$("home").classList.contains("hidden"))onPin(+e.key);});

/* ---------- 화면 모드 ---------- */
var mode="normal", tt=null;
function toast(t){var x=$("toast");x.textContent=t;x.classList.remove("hidden");clearTimeout(tt);tt=setTimeout(function(){x.classList.add("hidden");},2600);}
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
function setMode(m){
  if(m==="full"){
    var de=document.documentElement, req=de.requestFullscreen||de.webkitRequestFullscreen;
    if(!req){toast("이 기기는 전체 화면을 지원하지 않아요. 공유 ▸ 홈 화면에 추가로 열어 주세요.");return;}
    try{var r=req.call(de);if(r&&r.catch)r.catch(function(){toast("전체 화면을 열 수 없어요.");});}catch(e){toast("전체 화면을 열 수 없어요.");return;}
  }else if(isFs()){
    var ex=document.exitFullscreen||document.webkitExitFullscreen; if(ex)ex.call(document);
  }
  mode=m; markMode(); fit();
}
function markMode(){
  var bs=document.querySelectorAll("#modes button");
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-m")===mode);
}
function onFsChange(){if(!isFs()&&mode==="full"){mode="normal";markMode();}setTimeout(fit,60);}
document.addEventListener("fullscreenchange",onFsChange);
document.addEventListener("webkitfullscreenchange",onFsChange);
Array.prototype.forEach.call(document.querySelectorAll("#modes button"),function(b){b.onclick=function(){setMode(b.getAttribute("data-m"));};});
function fit(){
  var vw=window.innerWidth, vh=window.innerHeight, port=vh>vw*1.1;
  stage.className=port?"port":"land";
  var W=port?720:1280, H=port?1280:720, s=Math.min(vw/W,vh/H);
  var y;
  if(mode==="small"){s*=.8; y=vh-H*s;} else y=(vh-H*s)/2;
  stage.style.transform="translate("+((vw-W*s)/2)+"px,"+y+"px) scale("+s+")";
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){setTimeout(fit,200);});

buildDisc(); place(ringNow,0); buddy("normal","핀을 눌러요"); renderProb(); fit(); showHome();
})();
